# Docker profile. Credentials are injected by Docker Compose.
server.port=${SERVER_PORT:8087}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/capitec?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:capitec}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.root=INFO
logging.level.com.capitec.deportment.appointment=INFO
logging.file.name=/app/logs/deportment.log
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
