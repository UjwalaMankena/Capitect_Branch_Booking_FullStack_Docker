spring.application.name=deportment
server.port=8087

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/capitec
spring.datasource.username=root
spring.datasource.password=ChangeMe_db_12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Application Logging Configuration

# Root logging level
logging.level.root=INFO

# Application package logging
logging.level.com.capitec.deportment.appointment=DEBUG

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/deportment.log

# Log file maximum size
logging.logback.rollingpolicy.max-file-size=10MB

# Keep historical log files
logging.logback.rollingpolicy.max-history=30

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Hibernate SQL parameter logging (avoid in production)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT Configuration
jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef}
jwt.expiration=3600000
