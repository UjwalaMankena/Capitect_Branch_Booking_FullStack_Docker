name: capitec-branch-booking

services:
  mysql:
    image: mysql:8.4
    container_name: capitec-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: capitec
      MYSQL_USER: ${DB_USERNAME:-capitec}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMe_db_12345}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ChangeMe_root_12345}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - booking-net

  backend:
    build:
      context: ./Branch_Booking_Backend
      dockerfile: Dockerfile
    container_name: capitec-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/capitec?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-capitec}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ChangeMe_db_12345}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "${BACKEND_PORT:-8087}:8087"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - booking-net

  frontend:
    build:
      context: ./Branch_Booking_FrontEnd
      dockerfile: Dockerfile
    container_name: capitec-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - booking-net

volumes:
  mysql_data:
  backend_logs:

networks:
  booking-net:
    driver: bridge
